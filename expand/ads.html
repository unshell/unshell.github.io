<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-5626603682905398">
    <title>广告</title>
    <link rel="shortcut icon" href="/assets/icon/favicon.svg">
    <link rel="stylesheet" href="/assets/css/animation.css">
    <style>
        body,
        div,
        span,
        p {
            padding: 0;
            margin: 0;
        }

        body {
            background-color: black;
        }

        .wrapper {
            position: relative;
            height: 162px;
            opacity: 0.9;
            overflow: hidden;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-color: black;
            user-select: none;
            -webkit-user-select: none;
        }

        .wrapper:hover {
            opacity: 1;
        }

        .wrapper .ads {
            padding: 0 10px;
            text-align: center;
            font-size: 32px;
            color: #ffff45;
            overflow: hidden;
        }

        .wrapper .ads p {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .wrapper .ads p:first-child {
            color: #fff;
            padding: 22px 0;
            font-weight: 500;
        }

        .marked {
            position: absolute;
            left: 5px;
            bottom: 5px;
            display: inline-block;
            background-color: rgba(183, 183, 183, 0.5);
            color: white;
            opacity: 0.8;
            font-size: 13px;
            cursor: pointer;
            padding: 1px 5px 2px 5px;
            border-radius: 5px;
        }

        footer {
            display: none;
            justify-content: center;
            margin-top: 50px;
            font-size: 14px;
            color: #999;
        }

        footer p {
            padding: 0 10px;
            border-right: 1px solid #e9e9e9;
        }

        footer p:last-child {
            border: none;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <span class="marked" title="点击切换">广告</span>
    </div>
    <footer>
        <p>当前在线: <span id="online_count">-</span> 人</p>
        <p>连接状态: <span id="online_status">连接中...</span></p>
    </footer>
    <script src="/assets/libs/supabase.min.js"></script>
    <!-- JS部分 -->
    <script src="/assets/libs/jquery-3.7.1.min.js"></script>
    <script src="/assets/js/api.min.js?v=2410121401"></script>
    <script>
        window.onload = function () {
            window.parent.postMessage({ app: 'fish-ads-app', type: 'loaded' }, '*')
        };
        // 在线统计：Supabase Realtime Presence（与 re-clear 同一服务，独立频道互不影响）
        ;(function () {
            var uuid;
            try {
                uuid = localStorage.getItem('fish_ads_uuid');
            } catch (e) { }
            if (!uuid) {
                uuid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                    var r = Math.random() * 16 | 0;
                    return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
                });
                try {
                    localStorage.setItem('fish_ads_uuid', uuid);
                } catch (e) { }
            }

            var client = supabase.createClient('https://tnnqujscikndjrvxtcds.supabase.co', 'sb_publishable_XPHE2UDMTOWe6iygcg_W5Q_J6-PYZPh', {
                auth: { persistSession: false }
            }), channel = client.channel('fish-ads-online', {
                config: { presence: { key: uuid } }
            });

            channel.on('presence', { event: 'sync' }, function () {
                // 按 uuid 去重，同一用户开多个标签页只算一人
                var count = Object.keys(channel.presenceState()).length;
                $('#online_count').text(count);
                // 消息格式与原来一致，member/hot 均为当前在线人数，有人进出时实时推送
                window.parent.postMessage({
                    app: 'fish-ads-app', type: 'counter', counter: {
                        member: String(count),
                        hot: String(count),
                    }
                }, '*')
            }).subscribe(function (status) {
                if (status === 'SUBSCRIBED') {
                    $('#online_status').text('已连接');
                    channel.track({ uuid: uuid, joinedAt: Date.now() });
                } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                    $('#online_status').text('连接断开');
                }
            });
        })();
        $(document).ready(function () {
            var $wrapper = $('.wrapper'), random = function (min, max, exclude) {
                var number;
                do {
                    number = Math.floor(Math.random() * (max - min + 1)) + min;
                } while (exclude && exclude.includes(number));
                return number;
            }, where = params(), texts = [
                { top: '平民零氪搬砖服', bottom: '装备全靠 打元宝能交易' },
                { top: '复古零氪开荒版', bottom: '开 局 小 怪 爆 神 装' },
                { top: '散人专属零氪服', bottom: '地图无门槛 打宝全自由' },
                { top: '全新零氪打金版', bottom: '开 局 充 值 券 直 接 送' },
                { top: '经典零氪怀旧服', bottom: '不用肝 轻松打宝爽不停' },
            ], animations = [
                'jello-horizontal',
                'bounce-top',
                'blink-2',
                'shake-top'
            ], createAds = function (type, exclude) { // 创建广告
                if (type === 'big') { // 大图模式
                    adsIndex = random(1, 4, exclude);
                    $wrapper.css('height', '100vh');
                    $wrapper.css('background-image', 'url(/assets/ads/video-' + ('00' + adsIndex) + '.webp?v=250724), url(/assets/ads/big-' + ('00' + adsIndex) + '.jpg?v=250724)');
                } else if (type === 'text') { // 文案模式
                    adsIndex = random(0, texts.length - 1, exclude);
                    $('.ads').remove()
                    var ads = document.createElement('div'),
                        p = document.createElement('p'),
                        text = texts[adsIndex],
                        animate = animations[random(0, animations.length - 1)];
                    ads.className = 'ads';
                    $wrapper.append(ads);
                    p.innerText = text.top;
                    ads.append(p);
                    p = document.createElement('p');
                    p.innerText = text.bottom;
                    p.className = animate;
                    ads.append(p);
                    p.addEventListener('animationend', function () {
                        p.classList.remove(animate);
                        setTimeout(function () {
                            animate = animations[random(0, animations.length - 1)];
                            p.classList.add(animate);
                        }, 5000);
                    });
                } else { // 默认模式
                    adsIndex = random(1, 4, exclude);
                    $wrapper.css('background-image', 'url(/assets/ads/' + ('00' + adsIndex) + '.jpg?v=250724)');
                }
            }, adsIndex = 1;

            createAds(where.type, []);
            // 更换广告
            $('.marked').click(function () {
                createAds(where.type, [adsIndex]);
            });
            // 查看流量
            $wrapper.dblclick(function () {
                $('footer').css('display', 'flex');
            });
        });
    </script>
</body>

</html>
