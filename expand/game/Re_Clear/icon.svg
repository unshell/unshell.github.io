<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="tile1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="tile2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="tile3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="112" y="156" width="132" height="164" rx="20" fill="url(#tile1)" stroke="#c4b5fd" stroke-width="4"/>
    <rect x="124" y="168" width="108" height="140" rx="14" fill="none" stroke="#ddd6fe" stroke-width="2" stroke-opacity="0.5"/>
    <text x="178" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="92" font-weight="900" fill="#ffffff" filter="url(#glow)">A</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="248" y="196" width="132" height="164" rx="20" fill="url(#tile2)" stroke="#f5d0fe" stroke-width="4"/>
    <rect x="260" y="208" width="108" height="140" rx="14" fill="none" stroke="#fae8ff" stroke-width="2" stroke-opacity="0.5"/>
    <text x="314" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="92" font-weight="900" fill="#ffffff" filter="url(#glow)">B</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="180" y="296" width="132" height="164" rx="20" fill="url(#tile3)" stroke="#a5f3fc" stroke-width="4"/>
    <rect x="192" y="308" width="108" height="140" rx="14" fill="none" stroke="#cffafe" stroke-width="2" stroke-opacity="0.5"/>
    <text x="246" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="92" font-weight="900" fill="#ffffff" filter="url(#glow)">C</text>
  </g>

  <g filter="url(#glow)">
    <circle cx="380" cy="140" r="44" fill="#10b981" stroke="#6ee7b7" stroke-width="4"/>
    <path d="M360 142 L374 156 L400 128" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
