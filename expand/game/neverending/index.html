<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Neverending · 无限互动故事</title>
    <link rel="icon" type="image/png" href="/expand/game/neverending/logo.png" />
    <script>
      // 首帧前确定明暗模式，避免刷新闪白
      (function () {
        var mode = 'auto';
        try {
          var raw = localStorage.getItem('neverending.settings');
          if (raw) {
            var p = JSON.parse(raw);
            mode = p.mode || p.theme || 'auto';
          }
        } catch (e) {}
        var light = mode === 'light' ||
          (mode === 'auto' && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
      })();
    </script>
    <script type="module" crossorigin src="/expand/game/neverending/assets/home-BP0cfurr.js"></script>
    <link rel="modulepreload" crossorigin href="/expand/game/neverending/assets/themeToggle-Bqi62QFh.js">
    <link rel="stylesheet" crossorigin href="/expand/game/neverending/assets/themeToggle-DqOOw6ba.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
