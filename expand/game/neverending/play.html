<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
    <title>冒险中 · Neverending</title>
    <script>
      // 首帧前确定主题，避免刷新闪白
      (function () {
        var t = 'auto';
        try {
          var raw = localStorage.getItem('neverending.settings');
          if (raw) t = JSON.parse(raw).theme || 'auto';
        } catch (e) {}
        var light = t === 'light' ||
          (t === 'auto' && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
      })();
    </script>
    <script type="module" crossorigin src="/expand/game/neverending/assets/play-BEpeeuUR.js"></script>
    <link rel="modulepreload" crossorigin href="/expand/game/neverending/assets/themeToggle-BE32YMjq.js">
    <link rel="stylesheet" crossorigin href="/expand/game/neverending/assets/themeToggle-BGdaQcAi.css">
  </head>
  <body class="play-body">
    <div id="app"></div>
  </body>
</html>
